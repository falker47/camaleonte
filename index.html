<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Camaleonte</title>
    <meta name="description" content="Il gioco di deduzione sociale per feste" />
    <meta name="theme-color" content="#0f0a1e" />
    <link rel="preload" as="image" href="./src/assets/brand/camaleonte-tropical-background.webp" />
    <link rel="preload" as="image" href="./src/assets/brand/camaleonte-foreground.webp" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Camaleonte" />

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:title" content="Camaleonte" />
    <meta property="og:description" content="Il gioco di deduzione sociale per feste" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://falker47.github.io/camaleonte/" />
    <meta property="og:image" content="https://falker47.github.io/camaleonte/preview.png?v=3" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Camaleonte" />
    <meta name="twitter:description" content="Il gioco di deduzione sociale per feste" />
    <meta name="twitter:image" content="https://falker47.github.io/camaleonte/preview.png?v=3" />

    <!-- Keep first paint independent of the React bundle and its stylesheet. -->
    <style>
      html, body { margin: 0; min-height: 100%; background: #0f0a1e; }
      #app-launch {
        position: fixed;
        inset: 0;
        z-index: 1000;
        overflow: hidden;
        isolation: isolate;
        background: #0f0a1e;
        color: #f4fff7;
        font-family: system-ui, sans-serif;
      }
      .launch-background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: -2;
      }
      #app-launch::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(180deg, rgba(15, 10, 30, .1), rgba(15, 10, 30, .02) 48%, rgba(15, 10, 30, .5));
      }
      .launch-content {
        box-sizing: border-box;
        height: 100%;
        max-width: 34rem;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
      }
      .launch-brand {
        display: block;
        width: 100%;
        height: auto;
        max-height: 58vh;
        object-fit: contain;
        filter: drop-shadow(0 12px 22px rgba(0, 0, 0, .25));
      }
      .launch-fallback {
        display: none;
        margin: 0;
        font-size: clamp(2rem, 9vw, 3.5rem);
        font-weight: 900;
        letter-spacing: .06em;
      }
      #app-launch[data-artwork-unavailable] .launch-fallback { display: block; }
      .launch-status {
        width: min(15rem, 75%);
        margin-top: clamp(24px, 5vh, 44px);
        text-align: center;
      }
      .launch-track {
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(236, 253, 245, .15);
      }
      .launch-track::after {
        content: "";
        display: block;
        height: 100%;
        width: 38%;
        border-radius: inherit;
        background: #c2f8bc;
        animation: launch-loading 1.4s ease-in-out infinite;
      }
      .launch-message {
        margin: 14px 0 0;
        font-size: 12px;
        line-height: 1.5;
        letter-spacing: .04em;
        color: #e1f5e7;
        text-shadow: 0 1px 5px rgba(0, 0, 0, .7);
      }
      .launch-retry {
        margin-top: 16px;
        min-height: 44px;
        padding: 10px 24px;
        border: 1px solid rgba(225, 245, 231, .5);
        border-radius: 14px;
        background: #123e30;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .launch-retry:focus-visible { outline: 3px solid #c2f8bc; outline-offset: 3px; }
      #app-launch [hidden] { display: none; }
      #app-launch[data-failed] .launch-track { display: none; }
      .launch-noscript {
        position: fixed;
        inset: auto 24px max(24px, env(safe-area-inset-bottom, 0px));
        z-index: 1001;
        color: #fff;
        font: 14px/1.5 system-ui, sans-serif;
        text-align: center;
      }
      @keyframes launch-loading {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(365%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .launch-track::after { animation: none; width: 100%; opacity: .65; }
      }
      @media (max-height: 440px) {
        .launch-brand { max-height: 50vh; }
        .launch-status { margin-top: 16px; }
      }
    </style>
  </head>
  <body>
    <div id="app-launch" role="status" aria-label="Avvio di Camaleonte" aria-live="polite">
      <img class="launch-background" src="./src/assets/brand/camaleonte-tropical-background.webp" alt="" width="841" height="1870" fetchpriority="high" />
      <div class="launch-content">
        <img class="launch-brand" src="./src/assets/brand/camaleonte-foreground.webp" alt="Camaleonte" width="1280" height="747" fetchpriority="high" />
        <h1 class="launch-fallback">CAMALEONTE</h1>
        <div class="launch-status">
          <div class="launch-track" aria-hidden="true"></div>
          <p class="launch-message" id="launch-message">Prepariamo il gioco…</p>
          <button class="launch-retry" id="launch-retry" type="button" hidden>Riprova</button>
        </div>
      </div>
    </div>
    <div id="root" inert aria-busy="true"></div>
    <noscript><p class="launch-noscript">Per giocare a Camaleonte, attiva JavaScript e riapri l’app.</p></noscript>
    <script>
      // This recovery path also works if the small startup bundle itself fails.
      (() => {
        const showLaunchError = () => {
          const launch = document.getElementById('app-launch');
          if (!launch) return;
          launch.dataset.failed = '';
          document.getElementById('launch-message').textContent = 'Il gioco non si è avviato. Riprova.';
          document.getElementById('launch-retry').hidden = false;
        };
        const onScriptError = (event) => {
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module') showLaunchError();
        };
        document.getElementById('launch-retry').addEventListener('click', () => window.location.reload());
        window.addEventListener('camaleonte:launch-error', showLaunchError);
        window.addEventListener('error', onScriptError, true);
        window.addEventListener('camaleonte:ready', () => {
          window.removeEventListener('camaleonte:launch-error', showLaunchError);
          window.removeEventListener('error', onScriptError, true);
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
