name: Fix Camaleonte artwork variants

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/fix-camaleonte-assets.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Regenerate semantic PNG variants
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter, ImageOps

          src = Image.open("public/preview.png").convert("RGB")
          w, h = src.size

          # True 3:2 crop, preserving the centered subject and full title.
          crop_w = int(h * 3 / 2)
          left = (w - crop_w) // 2
          ratio = src.crop((left, 0, left + crop_w, h))
          ratio = ratio.resize((1536, 1024), Image.Resampling.LANCZOS)
          ratio.save("public/camaleonte-3-2-ratio.png", optimize=True)

          # True square adaptation. Preserve the complete artwork instead of
          # destructively cropping the title; extend the jungle background.
          bg = ImageOps.fit(
              src,
              (1024, 1024),
              method=Image.Resampling.LANCZOS,
              centering=(0.5, 0.5),
          ).filter(ImageFilter.GaussianBlur(30))

          fg_h = round(1024 * h / w)
          fg = src.resize((1024, fg_h), Image.Resampling.LANCZOS)

          mask = Image.new("L", fg.size, 255)
          pixels = mask.load()
          feather = 80
          for y in range(fg.height):
              if y < feather:
                  alpha = int(255 * y / feather)
              elif y >= fg.height - feather:
                  alpha = int(255 * (fg.height - 1 - y) / feather)
              else:
                  alpha = 255
              for x in range(fg.width):
                  pixels[x, y] = alpha

          square = bg.copy()
          square.paste(fg, (0, (1024 - fg.height) // 2), mask)
          square.save("public/camaleonte-square.png", optimize=True)

          assert Image.open("public/camaleonte-3-2-ratio.png").size == (1536, 1024)
          assert Image.open("public/camaleonte-square.png").size == (1024, 1024)

          print("camaleonte-3-2-ratio.png: 1536x1024 (3:2)")
          print("camaleonte-square.png: 1024x1024 (1:1)")
          PY

      - name: Commit corrected assets and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-camaleonte-assets.yml
          git add public/camaleonte-3-2-ratio.png public/camaleonte-square.png
          git commit -m "fix: restore semantic artwork variants [skip ci]"
          git push
