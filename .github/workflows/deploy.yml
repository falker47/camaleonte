name: Verify and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:core
      - run: npm run build

      - name: Verify Android packaging without changing web assets
        if: github.event_name == 'pull_request'
        run: |
          npm run build:android
          for asset in preview.png camaleonte-3-2-ratio.png camaleonte-square.png; do
            test -f "dist/$asset"
            test ! -e "android/app/src/main/assets/public/$asset"
          done

      - name: Set up Java 21 for Android release verification
        if: github.event_name == 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile unsigned Android release with R8
        if: github.event_name == 'pull_request'
        run: |
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          # The CI runner has no release keystore. Signing is the only disabled step.
          sed -i '/^[[:space:]]*signingConfig signingConfigs.release$/d' android/app/build.gradle
          (cd android && bash ./gradlew --no-daemon :app:assembleRelease)
          apk=(android/app/build/outputs/apk/release/*.apk)
          test -s "${apk[0]}"
          stat -c 'Unsigned release APK: %s bytes' "${apk[0]}"
          unzip -l "${apk[0]}" 'classes*.dex'

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
