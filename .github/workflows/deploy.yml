name: Verify and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:core
      - run: npm run build

      - name: Verify Android packaging without changing web assets
        if: github.event_name == 'pull_request'
        run: |
          npm run build:android
          for asset in preview.png camaleonte-3-2-ratio.png camaleonte-square.png; do
            test -f "dist/$asset"
            test ! -e "android/app/src/main/assets/public/$asset"
          done

      - name: Set up Java 21 for Android release verification
        if: github.event_name == 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile unsigned Android release with R8
        if: github.event_name == 'pull_request'
        run: |
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          # The CI runner has no release keystore. Signing is the only disabled step.
          sed -i '/^[[:space:]]*signingConfig signingConfigs.release$/d' android/app/build.gradle
          (cd android && bash ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease)
          apk=(android/app/build/outputs/apk/release/*.apk)
          test -s "${apk[0]}"
          stat -c 'Unsigned release APK: %s bytes' "${apk[0]}"
          unzip -l "${apk[0]}" 'classes*.dex'
          bundle=(android/app/build/outputs/bundle/release/*.aab)
          test -s "${bundle[0]}"
          stat -c 'Unsigned release AAB (verification only): %s bytes' "${bundle[0]}"

      # Use an isolated package ID and the generated Android debug key so testers
      # can install a release-optimized APK without uninstalling the Play version.
      - name: Build installable isolated QA APK (release optimizations)
        if: github.event_name == 'pull_request'
        run: |
          sed -i '/^[[:space:]]*minifyEnabled true$/a\            signingConfig signingConfigs.debug\n            applicationIdSuffix ".qa"' android/app/build.gradle
          sed -i 's/android:label="@string\/app_name"/android:label="Camaleonte QA"/; s/android:label="@string\/title_activity_main"/android:label="Camaleonte QA"/' android/app/src/main/AndroidManifest.xml
          (cd android && bash ./gradlew --no-daemon :app:assembleRelease)
          mkdir -p qa-apk
          cp android/app/build/outputs/apk/release/app-release.apk qa-apk/Camaleonte-QA.apk
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/apksigner" verify --verbose qa-apk/Camaleonte-QA.apk
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/aapt" dump badging qa-apk/Camaleonte-QA.apk | grep -F "package: name='com.falker.camaleonte.qa'"
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/aapt" dump badging qa-apk/Camaleonte-QA.apk | grep -F "application-label:'Camaleonte QA'"
          stat -c 'Installable Camaleonte QA APK: %s bytes' qa-apk/Camaleonte-QA.apk

      - name: Check PowerShell Play AAB builder syntax
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('build-play-release.ps1', [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Upload installable Camaleonte QA APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Camaleonte-QA-optimized-APK
          path: qa-apk/Camaleonte-QA.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  verify-jdk21-windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test local JDK 21 discovery and fallback from invalid JAVA_HOME
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $parseErrors = @()
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'build-play-release.ps1'), [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw "Play build script has parser errors" }
          $fn = $ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Get-UsableJdk21'
          }, $true)
          if (-not $fn) { throw 'Missing Get-UsableJdk21 function' }
          . ([scriptblock]::Create($fn.Extent.Text))
          $expectedHome = $env:JAVA_HOME
          if (-not $expectedHome) { throw 'CI runner did not set JAVA_HOME' }
          $detected = Get-UsableJdk21
          if ($detected -ne $expectedHome) { throw "Expected $expectedHome, found $detected" }
          $env:JAVA_HOME = 'C:\does-not-exist\jdk-17'
          $fallback = Get-UsableJdk21
          if ($fallback -ne $expectedHome) { throw "JDK 21 PATH fallback failed: $fallback" }
          Write-Host "JDK 21 detection and fallback verified: $fallback"

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
